name: Louis App Tests

on:
  merge_group:
  workflow_dispatch:
  push:
    branches:
      - develop
      - louis-test
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  Test:
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kong'

      # - name: Configure npm auth for GitHub Packages
      #   run: |
      #     echo "@kong:registry=https://npm.pkg.github.com" >> ~/.npmrc
      #     echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
      #     echo "always-auth=true" >> ~/.npmrc
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install deps without lifecycle scripts
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Build app for Louis tests
        run: NODE_OPTIONS='--max_old_space_size=6144' npm run app-build

      - name: Run Louis Test project
        run: npm run test:build -w packages/insomnia-smoke-test -- --project="Louis Test"

      # 生成 Allure HTML 报告
      - name: Generate Allure report
        if: always()
        run: |
          npx allure-commandline generate ./packages/insomnia-smoke-test/allure-results --clean -o ./out/allure-report

      # 可选：在 Actions 页面保留产物
      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: ./out/allure-report

      # 可选：定义 Pages 子目录（修复你当前 steps.path.outputs.subdir 未定义问题）
      - name: Compute report subdir
        id: path
        run: echo "subdir=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      # 发布到 gh-pages
      - name: Deploy to GitHub Pages
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out/allure-report
          publish_branch: gh-pages
          destination_dir: ${{ steps.path.outputs.subdir }}
          keep_files: true
